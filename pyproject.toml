[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleconvbot"
version = "0.1.0.dev0"
description = "Telegram File Toolbox"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Pillow==12.3.0",
  "SQLAlchemy[asyncio]==2.0.54",
  "aiogram==3.31.0",
  "asyncpg==0.31.0",
  "pillow-heif==1.8.0",
  "pypdf==6.19.0",
  "pypdfium2==5.13.0",
  "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-q", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
  "integration: tests requiring local PostgreSQL and Redis",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/simpleconvbot/gateway.py" = ["RUF001"]
"src/simpleconvbot/runtime.py" = ["RUF001"]
"src/simpleconvbot/ui.py" = ["RUF001"]
"tests/test_ui.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
