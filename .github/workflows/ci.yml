name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: simpleconvbot
          POSTGRES_USER: simpleconvbot
          POSTGRES_PASSWORD: simpleconvbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simpleconvbot -d simpleconvbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://simpleconvbot:simpleconvbot@localhost:5432/simpleconvbot
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify media toolchain
        run: |
          FFMPEG_PATH="$(command -v ffmpeg)"
          FFPROBE_PATH="$(command -v ffprobe)"
          test -n "$FFMPEG_PATH"
          test -n "$FFPROBE_PATH"
          "$FFMPEG_PATH" -version > /tmp/ffmpeg-version.txt
          "$FFPROBE_PATH" -version > /tmp/ffprobe-version.txt
          head -n 1 /tmp/ffmpeg-version.txt
          head -n 1 /tmp/ffprobe-version.txt
          echo "SIMPLECONVBOT_FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "SIMPLECONVBOT_FFPROBE_PATH=$FFPROBE_PATH" >> "$GITHUB_ENV"

      - name: Verify
        run: python scripts/verify.py

      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable

      - name: Integration
        run: python scripts/verify_integration.py

      - name: Build production image
        run: docker build --tag simpleconvbot:ci .

      - name: Smoke production image
        run: docker run --rm simpleconvbot:ci python -m simpleconvbot --version

      - name: Smoke production media toolchain
        run: |
          docker run --rm simpleconvbot:ci ffmpeg -version
          docker run --rm simpleconvbot:ci ffprobe -version

      - name: Verify hardened worker container profile
        run: |
          docker run --rm             --network none             --read-only             --cap-drop ALL             --security-opt no-new-privileges             --pids-limit 64             --memory 768m             --cpus 1.0             --tmpfs /app/var/jobs:rw,nosuid,nodev,noexec,size=134217728,uid=10001,gid=10001,mode=0700             -e TEMP_ROOT=/app/var/jobs             simpleconvbot:ci             python -m simpleconvbot.security_selftest
